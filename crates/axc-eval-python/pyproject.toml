[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "axc-eval"
version = "0.3.2"
description = "Deterministic evaluator for typed condition trees and decision plans"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "axc_eval"
