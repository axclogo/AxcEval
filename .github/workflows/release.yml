name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: node scripts/check-release-tag.mjs
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --manifest-path crates/axc-eval-python/Cargo.toml --out dist
          target: ${{ matrix.target }}
          manylinux: auto
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: node scripts/check-release-tag.mjs
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2
        with:
          tool: wasm-pack@0.15.1
          fallback: none
      - run: wasm-pack build crates/axc-eval-wasm --release --target bundler --out-dir ../../dist/package
      - run: node scripts/package-wasm.mjs
      - run: node scripts/check-npm-publish.mjs dist/package/package.json --package-only
      - run: npm pack ./dist/package --pack-destination ./dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wasm-package
          path: dist/*.tgz
          if-no-files-found: error

  npm:
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wasm-package
          path: dist
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: node --test scripts/check-npm-publish.test.mjs
      - name: Check npm package release state
        id: package
        run: |
          archive="./dist/axclogo-eval-${GITHUB_REF_NAME#v}.tgz"
          tar -xOf "$archive" package/package.json > "$RUNNER_TEMP/npm-package.json"
          node scripts/check-npm-publish.mjs "$RUNNER_TEMP/npm-package.json"
      - name: Reject an uninitialized npm package
        if: steps.package.outputs.status == 'bootstrap'
        run: |
          echo '::error::@axclogo/eval does not exist on npm. Complete the documented one-time bootstrap before Trusted Publisher releases.'
          exit 1
      - name: Publish with npm Trusted Publisher
        if: steps.package.outputs.publish == 'true'
        run: npm publish "./dist/axclogo-eval-${{ steps.package.outputs.version }}.tgz"

  github-release:
    needs: [wheels, wasm, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            dist/*.whl
            dist/*.tgz
          generate_release_notes: true
